# Push na main -> testes + imagem :latest. Tag vX.Y.Z -> testes + imagem :vX.Y.Z (e :latest).
name: Testes e imagem Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minúsculas
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gestaoaxia" >> "$GITHUB_ENV"
      - name: Tag de versão (quando o push é de uma tag v*)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "TAG_VERSAO=${{ env.IMAGEM }}:${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.TAG_VERSAO }}
